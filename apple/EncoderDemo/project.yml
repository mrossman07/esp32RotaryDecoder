# XcodeGen spec. Regenerate the Xcode project after editing this file or adding/removing
# source files:   cd apple/EncoderDemo && xcodegen
name: EncoderDemo
options:
  bundleIdPrefix: io.github.mrossman07
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  EncoderBLE:
    path: ../Packages/EncoderBLE

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

targets:
  EncoderDemo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Sources
    dependencies:
      - package: EncoderBLE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mrossman07.EncoderDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Encoder Demo
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Encoder Demo uses Bluetooth to connect to your rotary encoder.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # macOS: sandboxed with the Bluetooth entitlement (iOS needs no entitlement).
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": EncoderDemo.entitlements
        ENABLE_HARDENED_RUNTIME: YES
