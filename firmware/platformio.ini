; PlatformIO project for the rotary encoder firmware.
; Boards: Seeed XIAO ESP32-C6 and XIAO ESP32-S3.
; NOTE: not yet built/verified. The C6 needs a recent Arduino-ESP32 core (3.x),
; which the stock espressif32 platform lags on, so we use the pioarduino fork.
; Confirm the platform URL and board ids in Phase 0.

[platformio]
default_envs = xiao_esp32c6

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial goes over the native USB port
    -DCORE_DEBUG_LEVEL=1
; lib_deps added in Phase 2 (NimBLE-Arduino); Phase 1 needs none.

[env:xiao_esp32c6]
board = seeed_xiao_esp32c6

[env:xiao_esp32s3]
board = seeed_xiao_esp32s3

; Host-side unit tests for the pure decoder/debounce logic (no hardware).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
