; PlatformIO project for the rotary encoder firmware.
; Boards: Seeed XIAO ESP32-C6 and XIAO ESP32-S3.
; The C6 needs a recent Arduino-ESP32 core (3.x), which the stock espressif32
; platform lags on, so we use the pioarduino fork.
;
; Build with the pio inside ~/.platformio/penv (Python 3.11): the Homebrew `pio`
; runs on Python 3.15, which this platform rejects.

[platformio]
default_envs = xiao_esp32c6

[esp32_base]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
; lib_deps added in Phase 2 (NimBLE-Arduino); Phase 1 needs none.

[env:xiao_esp32c6]
extends = esp32_base
board = seeed_xiao_esp32c6

[env:xiao_esp32s3]
extends = esp32_base
board = seeed_xiao_esp32s3

; Host-side unit tests for the pure decoder/debounce logic (no hardware).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
